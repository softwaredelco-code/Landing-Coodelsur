name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coodelsur-landing

    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_DEMO_MODE: ${{ secrets.NEXT_PUBLIC_DEMO_MODE }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: coodelsur-landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Prisma + Next.js standalone)
        run: npm run build

      - name: Package for cPanel
        run: |
          bash scripts/package-cpanel.sh
          tar -czf ../deploy-cpanel.tar.gz -C cpanel-deploy .

      - name: Upload bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: deploy-cpanel.tar.gz
          target: ${{ secrets.CPANEL_DEPLOY_PATH }}

      - name: Extract and post-deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.CPANEL_DEPLOY_PATH }}"
            NODE_VER="${{ secrets.CPANEL_NODE_VERSION }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            tar -xzf deploy-cpanel.tar.gz
            rm -f deploy-cpanel.tar.gz
            bash cpanel-post-deploy.sh "$APP_DIR" "${NODE_VER:-18}"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            sleep 5
            curl -fsS "${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/health" || echo "Health check pendiente — revisa Setup Node.js App"
