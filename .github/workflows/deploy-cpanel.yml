name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coodelsur-landing

    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_DEMO_MODE: ${{ secrets.NEXT_PUBLIC_DEMO_MODE || 'false' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: coodelsur-landing/package-lock.json

      - name: Verify build secrets
        run: |
          missing=0
          if [ -z "$DATABASE_URL" ]; then echo "::error::Falta secret DATABASE_URL en GitHub"; missing=1; fi
          if [ -z "$DIRECT_URL" ]; then echo "::error::Falta secret DIRECT_URL en GitHub"; missing=1; fi
          if [ -z "$NEXT_PUBLIC_SITE_URL" ]; then echo "::error::Falta secret NEXT_PUBLIC_SITE_URL en GitHub"; missing=1; fi
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "Secrets de build OK"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build Next.js standalone
        run: npx next build
        env:
          NODE_ENV: production

      - name: Package for cPanel
        run: bash scripts/package-cpanel.sh

      - name: Verify deploy package
        run: |
          ls -la cpanel-deploy/
          test -f cpanel-deploy/cpanel-post-deploy.sh
          test -f cpanel-deploy/server.js
          test -d cpanel-deploy/node_modules
          echo "node_modules incluido en el paquete ($(du -sh cpanel-deploy/node_modules | cut -f1))"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: coodelsur-landing/cpanel-deploy/
          server-dir: /
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**

      - name: Post-deploy en cPanel (manual)
        run: |
          echo "Deploy FTP completado."
          echo "En cPanel -> Terminal ejecuta:"
          echo "  cd ~/coodelsur-landing && bash cpanel-post-deploy.sh ~/coodelsur-landing 18"
          echo "Luego Setup Node.js App -> RESTART"
