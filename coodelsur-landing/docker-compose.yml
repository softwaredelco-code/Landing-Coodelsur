# PostgreSQL local para desarrollo (alternativa a Supabase en local)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coodelsur
      POSTGRES_PASSWORD: coodelsur
      POSTGRES_DB: coodelsur
    volumes:
      - coodelsur_pg:/var/lib/postgresql/data

volumes:
  coodelsur_pg:
